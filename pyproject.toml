[project]
name = "resonance"
version = "0.1.0"
description = "Staged distillation of reaction-prediction reasoning into small language models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "wandb>=0.25.1",
    "rdkit>=2024.3.1",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.8",
    "torch==2.10.0",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "tqdm>=4.67.3",
    "datasets>=4.7.0",
    "transformers>=4.56.0",
    "trl>=0.29.0",
    "vllm==0.18.0",
    "peft>=0.18.1",
    "ipykernel>=7.2.0",
]

[project.urls]
Repository = "https://github.com/rotskoff-group/resonance-rxn-reasoning"
Dataset = "https://huggingface.co/datasets/anaghaa/resonance"

[project.optional-dependencies]
benchmark = [
    "datasets>=4.7.0",
    "transformers>=4.56.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
]

train = [
    "datasets>=4.7.0",
    "torch>=2.10.0",
    "transformers>=4.56.0",
    "trl>=0.29.0",
    "flash-attn>=2.0.0",
]

[project.scripts]
resonance-sft = "resonance.workflows.sft:main"
resonance-dpo = "resonance.workflows.dpo:main"

[build-system]
requires = ["setuptools>=77"]   # PEP 639 license expression
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resonance = ["configs/**/*.yaml", "configs/**/*.json", "pipelines/traces/*.json", "release/*.txt"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
no-build-isolation-package = ["flash-attn"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.6",
    "ty>=0.0.22",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# Verbatim copies of the scripts that produced the reasoning-probe samples, pinned by hash
# (resonance.analysis.metareasoning.verify checks them against frozen/MANIFEST.json).
extend-exclude = ["src/resonance/analysis/metareasoning/frozen"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt text: line breaks inside these strings are part of the prompts the models were
# trained and evaluated on (prompts_stage1 is also pinned by fingerprint), so they are not rewrapped.
"src/resonance/data/prompts/benchmark/forward_rxn.py" = ["E501"]
"src/resonance/pipelines/traces/prompts_stage1.py" = ["E501"]

[tool.ty.src]
exclude = ["src/resonance/analysis/metareasoning/frozen"]

[tool.ty.environment]
# runner.py, resample.py and summary.py import the frozen scripts by module name (sys.path).
extra-paths = ["src/resonance/analysis/metareasoning/frozen"]
