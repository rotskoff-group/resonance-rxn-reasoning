[project]
name = "resonance"
version = "0.1.0"
description = "Staged distillation of reaction-prediction reasoning into small language models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "wandb>=0.25.1",
    "rdkit>=2024.3.1",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.8",
    "torch==2.10.0",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "tqdm>=4.67.3",
    "datasets>=4.7.0",
    "transformers>=4.56.0",
    "trl>=0.29.0",
    "vllm==0.18.0",
    "peft>=0.18.1",
    "lora>=0.3.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "ipykernel>=7.2.0",
    "modal>=1.4.2",
]

[project.optional-dependencies]
mapping = [
    "rxnmapper>=0.4.2",
]

benchmark = [
    "datasets>=4.7.0",
    "transformers>=4.56.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
]

train = [
    "datasets>=4.7.0",
    "torch>=2.10.0",
    "transformers>=4.56.0",
    "trl>=0.29.0",
    "flash-attn>=2.0.0",
]

[project.scripts]
resonance-sft = "resonance.workflows.sft:main"
resonance-dpo = "resonance.workflows.dpo:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resonance = ["configs/**/*.yaml", "configs/**/*.json", "data/datasets/*.json", "pipelines/traces/*.json"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
no-build-isolation-package = ["flash-attn"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "ty>=0.0.22",
]
